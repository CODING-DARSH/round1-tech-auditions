<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Tech Challenge — Attendance</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --border:#e7e9f0;
    --text:#1c1f2b; --muted:#6b7085;
    --accent:#4f46e5; --accent2:#06b6d4;
    --green:#16a34a; --green-bg:#ecfdf3;
    --red:#dc2626; --red-bg:#fef2f2;
    --amber:#d97706; --amber-bg:#fffbeb;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg,#f6f7fb 0%, #eef1fa 100%);
    color:var(--text); min-height:100vh; padding:32px 16px;
  }
  .wrap{max-width:1000px; margin:0 auto}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px}
  h1{font-size:22px; margin:0; font-weight:700}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted); font-size:13px; margin-top:2px}
  #logoutBtn{display:none; background:#fff; border:1px solid var(--border); padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:600; color:var(--muted)}

  #loginCard{
    max-width:360px; margin:60px auto; background:var(--card); border:1px solid var(--border);
    border-radius:18px; padding:32px; box-shadow:0 10px 30px rgba(79,70,229,.08);
  }
  #loginCard h2{margin-top:0; font-size:18px}
  #loginCard input{
    width:100%; padding:11px 14px; margin-top:10px; border-radius:10px;
    border:1px solid var(--border); font-size:14px; outline:none; transition:.15s;
  }
  #loginCard input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  #loginCard button{
    width:100%; margin-top:16px; padding:12px; border:none; border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-weight:700;
    font-size:14px; cursor:pointer; transition:.15s;
  }
  #loginCard button:hover{opacity:.92; transform:translateY(-1px)}
  #loginError{color:var(--red); font-size:13px; margin-top:10px; display:none}

  #app{display:none}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px}
  .stat{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
    box-shadow:0 4px 14px rgba(20,20,50,.04);
  }
  .stat .num{font-size:24px; font-weight:800}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.04em}
  .stat.accent .num{color:var(--accent)}
  .stat.green .num{color:var(--green)}
  .stat.amber .num{color:var(--amber)}

  .toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap}
  .toolbar input, .toolbar select{
    padding:10px 14px; border-radius:10px; border:1px solid var(--border); font-size:14px; outline:none; background:#fff;
  }
  .toolbar input{flex:1; min-width:180px}
  .toolbar input:focus, .toolbar select:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.1)}

  table{width:100%; border-collapse:collapse; background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 4px 20px rgba(20,20,50,.05)}
  th{text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:14px 16px; border-bottom:1px solid var(--border); background:#fafbfe}
  td{padding:14px 16px; border-bottom:1px solid var(--border); font-size:14px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafbff}

  .badge{padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; display:inline-block}
  .badge.inside{background:var(--green-bg); color:var(--green)}
  .badge.out{background:var(--amber-bg); color:var(--amber)}

  .checkinBtn{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none;
    padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; transition:.15s;
  }
  .checkinBtn:hover{opacity:.9; transform:translateY(-1px)}
  .checkinBtn:disabled{background:#d1d5db; cursor:not-allowed; transform:none}

  #empty{text-align:center; padding:40px; color:var(--muted); font-size:14px}

  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:14px 18px; box-shadow:0 10px 30px rgba(0,0,0,.12); font-size:14px;
    font-weight:600; opacity:0; transform:translateY(10px); transition:.25s; max-width:320px;
  }
  .toast.show{opacity:1; transform:translateY(0)}
  .toast.success{border-left:4px solid var(--green); color:var(--green)}
  .toast.error{border-left:4px solid var(--red); color:var(--red)}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginCard">
    <h2>🎟️ Organiser Login</h2>
    <input id="username" placeholder="Username" value="admin">
    <input id="password" type="password" placeholder="Password" value="admin123">
    <button onclick="login()">Log In</button>
    <div id="loginError"></div>
  </div>

  <div id="app">
    <header>
      <div>
        <h1>Nexus <span>Tech Challenge</span> — Attendance</h1>
        <div class="sub">Live event check-in dashboard</div>
      </div>
      <button id="logoutBtn" onclick="logout()">Log out</button>
    </header>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input id="searchBox" placeholder="Search by name or student ID..." oninput="loadStudents()">
      <select id="deptFilter" onchange="loadStudents()">
        <option value="">All Departments</option>
        <option>AIML</option><option>CSE</option><option>ISE</option><option>ECE</option>
      </select>
      <select id="statusFilter" onchange="loadStudents()">
        <option value="">All Status</option>
        <option value="INSIDE">INSIDE</option>
        <option value="NOT_ENTERED">NOT_ENTERED</option>
      </select>
    </div>

    <table>
      <thead><tr><th>Student ID</th><th>Name</th><th>Department</th><th>Status</th><th>Check-in Time</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" style="display:none">No students match your search.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "http://127.0.0.1:5000/api/v1";
let TOKEN = null;

function showToast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=> t.className = 'toast', 2500);
}

async function login(){
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  try{
    const res = await fetch(`${API}/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json();
    if(!data.success){ errBox.textContent = data.error.message; errBox.style.display='block'; return; }
    TOKEN = data.token;
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'inline-block';
    loadStats(); loadStudents();
  }catch(e){ errBox.textContent = 'Cannot reach backend — is it running?'; errBox.style.display='block'; }
}

function logout(){
  TOKEN = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
}

async function loadStats(){
  try{
    const res = await fetch(`${API}/stats`, {headers:{Authorization:`Bearer ${TOKEN}`}});
    const d = await res.json();
    document.getElementById('stats').innerHTML = `
      <div class="stat accent"><div class="num">${d.total_students}</div><div class="lbl">Total Students</div></div>
      <div class="stat green"><div class="num">${d.checked_in}</div><div class="lbl">Checked In</div></div>
      <div class="stat amber"><div class="num">${d.remaining}</div><div class="lbl">Remaining</div></div>
      <div class="stat"><div class="num">${d.occupancy_percent}%</div><div class="lbl">Occupancy</div></div>
    `;
  }catch(e){}
}

async function loadStudents(){
  const q = document.getElementById('searchBox').value;
  const dept = document.getElementById('deptFilter').value;
  const status = document.getElementById('statusFilter').value;

  let url;
  if(dept || status){
    url = `${API}/attendance/search?department=${encodeURIComponent(dept)}&status=${encodeURIComponent(status)}`;
  } else {
    url = `${API}/students/search?q=${encodeURIComponent(q)}`;
  }

  try{
    const res = await fetch(url, {headers:{Authorization:`Bearer ${TOKEN}`}});
    const d = await res.json();
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    let students = d.students || [];
    if(q && (dept || status)){
      const ql = q.toLowerCase();
      students = students.filter(s => s.student_id.toLowerCase().includes(ql) || s.name.toLowerCase().includes(ql));
    }
    if(students.length === 0){ tbody.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    tbody.innerHTML = students.map(s => `
      <tr>
        <td>${s.student_id}</td>
        <td>${s.name}</td>
        <td>${s.department}</td>
        <td><span class="badge ${s.status==='INSIDE'?'inside':'out'}">${s.status}</span></td>
        <td>${s.timestamp ? new Date(s.timestamp).toLocaleTimeString() : '—'}</td>
        <td>${s.status==='INSIDE'
              ? `<button class="checkinBtn" disabled>Checked In</button>`
              : `<button class="checkinBtn" onclick="checkin('${s.student_id}', this)">Check In</button>`}</td>
      </tr>
    `).join('');
  }catch(e){ showToast('Failed to load students', 'error'); }
}

async function checkin(studentId, btn){
  btn.disabled = true; btn.textContent = 'Checking in...';
  const request_id = 'req_' + Math.random().toString(36).slice(2);
  try{
    const res = await fetch(`${API}/attendance/checkin`, {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:`Bearer ${TOKEN}`},
      body: JSON.stringify({student_id: studentId, request_id})
    });
    const d = await res.json();
    if(d.success){
      showToast(`✅ ${d.record.name} checked in`, 'success');
    } else {
      showToast(`⚠️ ${d.error.message}`, 'error');
    }
  }catch(e){
    showToast('Network error', 'error');
  }
  loadStudents(); loadStats();
}
</script>
</body>
</html>
